name: Deploy to AWS S3

on:
  push:
    branches:
      - main   

jobs:
   ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        if: fileExists('package.json')
        run: |
          npm ci

      - name: Run lint
        if: |
          fileExists('package.json') && contains(fromJSON('["' + join('","', fromJSON('["' + join('","', split(github.event.head_commit.message, ' ')) + '"]')) + '"]'), 'noop') == false
        run: |
          if npm run | grep -q 'lint'; then npm run lint; else echo "No lint script"; fi

      - name: Run tests
        if: fileExists('package.json')
        run: |
          if npm run | grep -q 'test'; then npm test --if-present; else echo "No test script"; fi

      - name: Upload test results (JUnit)
        if: always() && fileExists('test-results.xml')
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: ci
    steps:
     
      - name: Checkout code
        uses: actions/checkout@v4

     
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1 

    
      - name: Deploy to S3
        run: |
          aws s3 sync . s3://amznbuckt134134 \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --delete
