name: Deploy Website to S3
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main        # CI also runs on PRs, but deploy is blocked until merge

jobs:
  # ─────────────────────────────────────────
  # CI JOB — validate before we deploy anything
  # ─────────────────────────────────────────
  ci:
    name: CI – Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Validates HTML structure/syntax across every .html file
      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
  

      # Finds broken internal & external hyperlinks
     - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --exclude "^mailto:"
            --no-ignore
            .
          fail: true
          failIfEmpty: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Flags common HTML/CSS mistakes (missing alt text, deprecated tags, etc.)
      - name: Lint with HTMLHint
        run: |
          npm install -g htmlhint
          htmlhint "**/*.html" --config .htmlhintrc 2>/dev/null \
            || htmlhint "**/*.html"   # falls back to default rules if no config

  # ─────────────────────────────────────────
  # CD JOB — only runs after CI passes
  # ─────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: ci                          # ← blocks deploy if CI job fails
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload to S3
        run: |
          aws s3 sync . s3://my-website-yourname-2024 \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --delete

      # Busts CloudFront cache so visitors see your changes immediately
      - name: Invalidate CloudFront cache
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
