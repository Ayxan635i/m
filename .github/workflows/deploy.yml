name: CI & Deploy Node.js App to S3
on:
  push:
    branches: [ main ]
permissions:
  id-token: write    # Allow OIDC token request【2†L478-L486】
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'           # Automatic npm caching【32†L540-L549】

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint      # e.g. ESLint

      - name: Run unit tests
        run: npm test

      - name: Build website
        run: npm run build     # e.g. webpack, react-scripts build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::123456789012:role/my-s3-deploy-role
          aws-region: eu-north-1

      - name: Deploy to S3
        run: |
          aws s3 sync ./build s3://amznbuckt134134 --delete --acl public-read
